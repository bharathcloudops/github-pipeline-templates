#==============================================================================
# PIPELINE TEMPLATE VALIDATION
#==============================================================================

name: 01 - Template validation

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

#==============================================================================
# WORKFLOW PERMISSIONS AND CONCURRENCY
#==============================================================================

permissions:
  contents: read

concurrency:
  group: template-validation-${{ github.ref }}
  cancel-in-progress: true

#==============================================================================
# REUSABLE WORKFLOW TEST
#==============================================================================

jobs:
  validate-template:
    name: 01 - Validate reusable workflow
    uses: ./.github/workflows/terraform-validate.yml
    with:
      working_directory: tests/fixtures/terraform-basic
    permissions:
      contents: read

  validate-shell-template:
    name: 02 - Validate shell workflow
    uses: ./.github/workflows/shell-validate.yml
    with:
      search_path: scripts
      template_ref: ${{ github.sha }}
    permissions:
      contents: read

  validate-run-command-secrets:
    name: 03 - Validate Run Command secret ordering
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bharathcloudops, oci-platform, validate]
    timeout-minutes: 5

    steps:
      - name: 01 - Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 02 - Test ordered secret arguments
        run: bash tests/test-run-command-secret-order.sh

      - name: 04 - Test OCI CLI cache reuse
        run: bash tests/test-oci-cli-cache.sh

  validate-oci-bootstrap-template:
    name: 04 - Validate OCI bootstrap workflow
    uses: ./.github/workflows/terraform-oci-bootstrap.yml
    with:
      operation: validate
      runner_labels_json: '["self-hosted","bharathcloudops","oci-platform","validate"]'
      working_directory: tests/fixtures/terraform-basic
      template_ref: ${{ github.sha }}
    permissions:
      contents: read