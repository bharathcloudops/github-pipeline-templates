#==============================================================================
# SHARED TERRAFORM VALIDATION WORKFLOW
#==============================================================================

name: 11 - Shared Terraform validation

#==============================================================================
# WORKFLOW INPUTS
#==============================================================================

on:
  workflow_call:
    inputs:
      working_directory:
        description: Terraform root or module directory to validate
        required: true
        type: string
      terraform_version:
        description: Terraform CLI version used by the validation job
        required: false
        type: string
        default: 1.10.5
      runner_labels_json:
        description: JSON array of runner labels used by the validation job
        required: false
        type: string
        default: '["self-hosted","bharathcloudops","oci-platform","validate"]'

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read

#==============================================================================
# TERRAFORM VALIDATION
#==============================================================================

jobs:
  validate:
    name: 01 - Terraform validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 10

    steps:
      - name: 01 - Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 02 - Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: 03 - Prepare Terraform plugin cache
        run: |
          printf 'TF_PLUGIN_CACHE_DIR=%s/terraform-plugin-cache\n' "$RUNNER_TOOL_CACHE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TOOL_CACHE/terraform-plugin-cache"

      - name: 04 - Check formatting
        run: terraform -chdir=${{ inputs.working_directory }} fmt -check -diff

      - name: 05 - Initialise without backend
        run: terraform -chdir=${{ inputs.working_directory }} init -backend=false -input=false

      - name: 06 - Validate configuration
        run: terraform -chdir=${{ inputs.working_directory }} validate -no-color