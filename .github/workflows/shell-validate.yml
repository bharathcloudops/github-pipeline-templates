#==============================================================================
# SHARED SHELL VALIDATION WORKFLOW
#==============================================================================

name: 10 - Shared shell validation

#==============================================================================
# WORKFLOW INPUTS
#==============================================================================

on:
  workflow_call:
    inputs:
      search_path:
        description: Repository-relative directory containing shell scripts
        required: false
        type: string
        default: scripts
      template_ref:
        description: Git ref containing the workflow support scripts
        required: false
        type: string
        default: v0.8.0
      runner_labels_json:
        description: JSON array of runner labels used by the validation job
        required: false
        type: string
        default: '["self-hosted","bharathcloudops","oci-platform","validate"]'

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read

#==============================================================================
# SHELL VALIDATION
#==============================================================================

jobs:
  validate:
    name: 01 - Validate shell scripts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 10

    steps:
      - name: 01 - Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 02 - Checkout pipeline template scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bharathcloudops/github-pipeline-templates
          ref: ${{ inputs.template_ref }}
          path: .pipeline-templates

      - name: 03 - Validate script syntax
        env:
          SEARCH_PATH: ${{ inputs.search_path }}
        run: bash .pipeline-templates/scripts/validation/validate-shell.sh